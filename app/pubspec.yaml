name: swatantra
description: "Swatantra — ground truth, unerasable. Independent journalism on Arkiv."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  http: ^1.2.2
  crypto: ^3.0.6
  shared_preferences: ^2.3.3
  file_picker: ^8.1.4
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  image_path: assets/logo.png
  adaptive_icon_background: "#FFFBFA"
  adaptive_icon_foreground: assets/logo.png
  web:
    generate: true
    image_path: assets/logo.png
    background_color: "#FFFBFA"
    theme_color: "#E11D74"

flutter_native_splash:
  color: "#FFFBFA"
  image: assets/logo.png
  android: true
  web: true
  android_12:
    color: "#FFFBFA"
    image: assets/logo.png
