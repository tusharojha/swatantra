name: Build web + APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Pages deploys must not cancel each other. APK is a sibling job — a Pages
# failure must not fail or skip the APK (see continue-on-error on deploy).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pillow for favicon
        run: pip install pillow
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bundle Arkiv JS bridge
        working-directory: bridge
        run: |
          npm ci || npm install
          npm run build
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter web
        working-directory: app
        run: |
          flutter pub get
          dart run flutter_launcher_icons || true
          dart run flutter_native_splash:create || true
          python3 ../scripts/gen-brand-icons.py
          flutter build web --release --base-href /swatantra/
          cp build/web/index.html build/web/404.html
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        with:
          path: app/build/web
      - uses: actions/upload-artifact@v4
        with:
          name: swatantra-web
          path: app/build/web

  deploy-pages:
    needs: web
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable GitHub Pages (Actions source)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages" -f build_type=workflow \
            || echo "Pages already enabled, or this token cannot flip Settings → Pages."
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pillow for favicon
        run: pip install pillow
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bundle Arkiv JS bridge
        working-directory: bridge
        run: |
          npm ci || npm install
          npm run build
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter APK
        working-directory: app
        run: |
          flutter pub get
          dart run flutter_launcher_icons || true
          dart run flutter_native_splash:create || true
          python3 ../scripts/gen-brand-icons.py
          flutter build apk --release
      - name: Attach APK to GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Swatantra Android APK
          body: Release APK for Swatantra. Testnet only. Built from ${{ github.sha }}.
          files: app/build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: swatantra-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
