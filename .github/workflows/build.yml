name: Build web + APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bundle Arkiv JS bridge
        working-directory: bridge
        run: |
          npm ci || npm install
          npm run build
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter web
        working-directory: app
        run: |
          flutter pub get
          dart run flutter_launcher_icons || true
          dart run flutter_native_splash:create || true
          flutter build web --release --base-href /swatantra/
          cp build/web/index.html build/web/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web
      - id: deployment
        uses: actions/deploy-pages@v4

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bundle Arkiv JS bridge
        working-directory: bridge
        run: |
          npm ci || npm install
          npm run build
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter APK
        working-directory: app
        run: |
          flutter pub get
          dart run flutter_launcher_icons || true
          dart run flutter_native_splash:create || true
          flutter build apk --release
      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Swatantra Android APK
          body: Release APK for Swatantra. Testnet only. Built from ${{ github.sha }}.
          files: app/build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: swatantra-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
